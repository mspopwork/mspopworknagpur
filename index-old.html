<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MS POPWORK | Nagpur False Ceiling Contractor</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    body {
      background: #111;
      overflow: hidden;
    }

    /* TOP BAR */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 72px;
      padding: 8px 16px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      z-index: 10;

      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.55),
        transparent
      );
    }

    /* LOGO */
    .logo {
      width: 55px;
      height: 55px;
      object-fit: contain;
      border-radius: 50%;
    }

    /* MENU BUTTON */
    .menu-btn {
      width: 46px;
      height: 46px;

      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 12px;

      background: rgba(0,0,0,0.35);

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      gap: 5px;
    }

    .menu-btn span {
      width: 20px;
      height: 2px;
      background: white;
    }

    /* FULL SCREEN HERO */
    .hero {
      width: 100%;
      height: 100vh;

      position: relative;

      background-image:
        linear-gradient(
          to bottom,
          rgba(0,0,0,0.15),
          rgba(0,0,0,0.75)
        ),
        url("hero.jpg");

      background-size: cover;
      background-position: center;

      display: flex;
      align-items: flex-end;
    }

    /* TEXT + BUTTONS */
    .hero-content {
      width: 100%;
      text-align: center;

      color: white;

      padding: 0 20px 40px;
    }

    .hero-title {
      font-size: 38px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .hero-subtitle {
      font-size: 15px;
      margin-bottom: 22px;
    }

    /* BUTTONS */
    .buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .btn {
      padding: 14px 18px;

      border-radius: 10px;

      text-decoration: none;

      font-size: 14px;
      font-weight: bold;
    }

    .call {
      background: #16834b;
      color: white;
    }

    .quote {
      background: white;
      color: #111;
    }

    .design {
      background: rgba(0,0,0,0.45);
      color: white;

      border: 1px solid white;
    }

  </style>
</head>


<body>

  <!-- TOP BAR -->

  <header class="topbar">

    <!-- LOGO -->
    <img
      src="logo.png"
      class="logo"
      alt="MS POPWORK Logo"
    >

    <!-- MENU -->
    <button class="menu-btn">

      <span></span>
      <span></span>
      <span></span>

    </button>

  </header>


  <!-- HERO SECTION -->

  <main>

    <section class="hero">

      <div class="hero-content">

        <h1 class="hero-title">
          MS POPWORK
        </h1>

        <p class="hero-subtitle">
          False Ceiling & Interior Work • Nagpur
        </p>

        <div class="buttons">

          <a href="#" class="btn call">
            Call Now
          </a>

          <a href="#" class="btn quote">
            Get Quotation
          </a>

          <a href="#" class="btn design">
            Designs
          </a>

        </div>

      </div>

    </section>

  </main>

</body>
</html>
